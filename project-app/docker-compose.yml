services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    command: >-
      sh -c "composer install &&
      if [ ! -f .env ]; then cp .env.example .env; fi &&
      if [ -z \"$$APP_KEY\" ] && ! grep -q '^APP_KEY=base64:' .env; then php artisan key:generate --force; fi &&
      if [ -z \"$$APP_KEY\" ]; then export APP_KEY=\"$$(grep '^APP_KEY=' .env | cut -d= -f2-)\"; fi &&
      apache2-foreground"
    ports:
      - "127.0.0.1:8000:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-}
      APP_URL: http://nanis.net
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in project-app/.env}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in project-app/.env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in project-app/.env}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      DEMO_COORDINATOR_EMAIL: ${DEMO_COORDINATOR_EMAIL:-coordinacion@example.test}
      DEMO_SUPERVISOR_EMAIL: ${DEMO_SUPERVISOR_EMAIL:-supervisor1@example.test}
      DEMO_USER_EMAIL_DOMAIN: ${DEMO_USER_EMAIL_DOMAIN:-example.test}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    volumes:
      - ./.env:/var/www/html/.env:ro
      - vendor:/var/www/html/vendor
      - storage-data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  nginx-proxy:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      - app

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in project-app/.env}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in project-app/.env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in project-app/.env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in project-app/.env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
  vendor:
  storage-data:
